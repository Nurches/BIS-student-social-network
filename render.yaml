# Render Blueprint: New > Blueprint > this repository.
# The database is NOT created here: use Neon (free, does not expire) and paste
# its connection string into DATABASE_URL. See docs/deployment.md.
services:
  - type: web
    name: qatys-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS eu-central-1): every API request
    # runs several SQL queries, so API and database must sit side by side.
    region: frankfurt
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # asked once in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render creates a random secret
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # /data-checks tool page (docs/tools/data-checks-spec.md): who may run the checks.
      - key: DATA_CHECK_EMAILS
        value: laila@kbtu.kz,madina@kbtu.kz,akbota@kbtu.kz,nurassyl@kbtu.kz,union@kbtu.kz
      # Optional: the data checks connect as a read-only role. Empty = the main DATABASE_URL.
      - key: DATABASE_URL_READONLY
        sync: false
