<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qatys Admin</title>
<style>
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef2f9; --fg: #0f172a; --muted: #475569;
    --line: #d5dce8; --brand: #0b3d91; --brand-fg: #ffffff; --brand-soft: #e3ebf9;
    --accent: #ffb020; --ok: #05603a; --okbg: #d1fadf; --warn: #7a4a00; --warnbg: #fff1d6;
    --err: #9f1d1d; --errbg: #fee4e2; --info: #0b3d91; --infobg: #e3ebf9;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #121b2e; --surface-2: #1a2540; --fg: #e8eefb; --muted: #a5b4cf;
      --line: #2a3756; --brand: #8fb2ff; --brand-fg: #0b1220; --brand-soft: #1c2b4f;
      --accent: #ffc04d; --ok: #8ce9b5; --okbg: #0f3b27; --warn: #ffd58a; --warnbg: #3d2c08;
      --err: #ffb4ab; --errbg: #4a1612; --info: #b9ccff; --infobg: #1c2b4f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--brand); }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  h2 { font-size: 1.375rem; }
  h3 { font-size: 1.0625rem; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- top bar and navigation ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
            padding: 10px 20px; background: var(--brand); color: var(--brand-fg); }
  @media (prefers-color-scheme: dark) { .topbar { background: #0e2a63; color: #fff; } }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.125rem; }
  .logo-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px;
               background: var(--accent); color: #0b1220; font-weight: 800; }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: .9rem; opacity: .9; text-align: right; }
  /* Log out: white on the blue bar (button.btn.secondary would make it blue on blue). */
  .topbar button.btn, .topbar button.btn.secondary { color: #fff; background: transparent; border-color: rgba(255,255,255,.5); }
  .role { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px;
          background: var(--accent); color: #0b1220; font-size: .75rem; font-weight: 700; }

  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 50px); }
  nav.side { padding: 16px 12px; border-right: 1px solid var(--line); background: var(--surface); }
  nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px;
                    margin: 0 0 4px; padding: 0 12px; border: 0; border-radius: 8px;
                    background: transparent; color: var(--fg); font: inherit; font-weight: 500;
                    text-align: left; cursor: pointer; }
  nav.side button:hover { background: var(--surface-2); }
  nav.side button[aria-current="page"] { background: var(--brand-soft); color: var(--brand);
                                          font-weight: 700; }
  nav.side .ico { width: 20px; text-align: center; }
  nav.side .nav-count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px;
    background: var(--warn); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .request { display: grid; grid-template-columns: 1fr auto; gap: 12px 18px; align-items: start; }
  .request .title { font-weight: 700; font-size: 16px; }
  .request .reason { margin-top: 6px; }
  @media (max-width: 640px) { .request { grid-template-columns: 1fr; } }
  main { padding: 24px 28px 64px; max-width: 1180px; width: 100%; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav.side { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; border-right: 0;
               border-bottom: 1px solid var(--line); position: sticky; top: 50px; z-index: 4; }
    nav.side button { width: auto; flex: 0 0 auto; margin: 0; }
    main { padding: 16px 16px 48px; }
    .topbar { padding: 10px 16px; }
    .topbar .who .name { display: none; }
  }

  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
  .page-head .grow { flex: 1 1 260px; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  /* ---------- controls ---------- */
  button.btn, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
               min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent;
               background: var(--brand); color: var(--brand-fg); font: inherit; font-weight: 600;
               cursor: pointer; text-decoration: none; white-space: nowrap; }
  button.btn.secondary { background: transparent; color: var(--brand); border-color: var(--line); }
  button.btn.danger { background: transparent; color: var(--err); border-color: var(--line); }
  button.btn.danger.armed { background: var(--err); color: #fff; border-color: var(--err); }
  button.btn.small { min-height: 32px; padding: 0 10px; font-size: .875rem; }
  button.btn:disabled { opacity: .55; cursor: not-allowed; }
  button.btn:focus-visible, nav.side button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, .chip:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  label { display: block; font-weight: 600; font-size: .875rem; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; min-height: 42px; padding: 8px 12px; font: inherit;
                            color: var(--fg); background: var(--surface);
                            border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 88px; resize: vertical; }
  input[type="checkbox"] { width: 18px; min-height: 18px; height: 18px; accent-color: var(--brand); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: .8125rem; }

  /* ---------- surfaces ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .stack > * + * { margin-top: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .label { color: var(--muted); font-size: .8125rem; font-weight: 600;
                 text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 1.75rem; font-weight: 750; margin-top: 2px;
                 font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--muted); font-size: .8125rem; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                   margin: 26px 0 10px; }
  .section-title h3 { white-space: nowrap; }
  .section-title select { width: auto; max-width: min(420px, 60%); }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px;
           font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .b-ok { color: var(--ok); background: var(--okbg); }
  .b-warn { color: var(--warn); background: var(--warnbg); }
  .b-err { color: var(--err); background: var(--errbg); }
  .b-info { color: var(--info); background: var(--infobg); }
  .b-mute { color: var(--muted); background: var(--surface-2); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--surface); color: var(--fg); font: inherit; font-size: .875rem;
          font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand);
                               color: var(--brand-fg); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar select, .toolbar input { width: auto; min-width: 200px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;
                background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       background: var(--surface-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }

  .events { display: grid; gap: 12px; }
  .event { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .event .title { font-weight: 700; font-size: 1.0625rem; }
  .event .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .875rem; }
  .event .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .event .row-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 560px) { .event { grid-template-columns: 1fr; } .event .side { align-items: flex-start; } }
  .meter { width: 180px; max-width: 100%; height: 8px; border-radius: 99px; background: var(--surface-2);
           overflow: hidden; }
  .meter > span { display: block; height: 100%; background: var(--brand); }
  .meter.full > span { background: var(--accent); }

  .empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line);
           border-radius: 12px; background: var(--surface); }
  .notice { padding: 12px 14px; border-radius: 10px; margin: 0 0 14px; }
  .notice.ok { color: var(--ok); background: var(--okbg); }
  .notice.err { color: var(--err); background: var(--errbg); }
  .notice.info { color: var(--info); background: var(--infobg); }
  .notice.warn { color: var(--warn); background: var(--warnbg); }

  /* ---------- login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login .card { width: 100%; max-width: 400px; }
  .login .logo { color: var(--brand); margin-bottom: 4px; }

  /* ---------- drawer and toasts ---------- */
  dialog { width: min(760px, 100vw - 24px); max-height: calc(100vh - 48px); padding: 0; border: 0;
           border-radius: 14px; background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(10, 18, 34, .55); }
  .dlg-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px;
              border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
  .dlg-head .grow { flex: 1; }
  .dlg-body { padding: 18px 20px 22px; }
  .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: grid; gap: 8px;
            max-width: min(420px, calc(100vw - 32px)); }
  .toast { padding: 12px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
           font-weight: 500; white-space: pre-wrap; }
  .toast.ok { color: var(--ok); background: var(--okbg); }
  .toast.err { color: var(--err); background: var(--errbg); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
             border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Week 13: posters, check-in, analytics ---------- */
  .event.has-poster { grid-template-columns: 132px minmax(0, 1fr) auto; }
  .event .thumb { width: 132px; aspect-ratio: 16 / 9; border-radius: 8px; object-fit: cover;
                  background: var(--surface-2); border: 1px solid var(--line); }
  @media (max-width: 560px) { .event.has-poster { grid-template-columns: 1fr; } .event .thumb { width: 100%; } }
  .poster-preview { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px;
                    border: 1px solid var(--line); background: var(--surface-2); display: block; }
  .poster-empty { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9;
                  border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); }
  .checkin-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .checkin-box input { font-size: 1.25rem; letter-spacing: .12em; text-transform: uppercase; }
  .scan { position: relative; margin-top: 12px; border-radius: 12px; overflow: hidden; background: #000; }
  .scan video { display: block; width: 100%; max-height: 320px; object-fit: cover; }
  .scan .frame { position: absolute; inset: 18% 28%; border: 3px solid var(--accent); border-radius: 14px; }
  .result-log { display: grid; gap: 6px; margin-top: 14px; }
  .result-log .notice { margin: 0; }
  .big-count { font-size: 2.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
  .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .stars { color: #f59e0b; letter-spacing: 1px; white-space: nowrap; }
  .comment { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
  .attend { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; min-width: 140px; }
  .attend .bar > span { background: var(--ok); }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>

<!-- ============ sign in ============ -->
<section id="login-view" class="login hidden">
  <form id="login" class="card" autocomplete="on">
    <div class="logo"><span class="logo-mark">Q</span> Qatys Admin</div>
    <p class="muted small" style="margin:0 0 6px">For Student Union moderators and community owners.</p>
    <div id="login-msg" class="notice err hidden" role="alert"></div>
    <label for="email">University email</label>
    <input id="email" type="email" autocomplete="username" required placeholder="name@kbtu.kz">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit" style="width:100%">Sign in</button></div>
    <p class="hint">Also available: <a href="/data-checks">Data checks</a> · <a href="/docs">Swagger UI</a></p>
  </form>
</section>

<!-- ============ the panel ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="logo"><span class="logo-mark">Q</span> Qatys Admin</div>
    <div class="spacer"></div>
    <div class="who"><span class="name" id="who-name"></span><span id="who-role" class="role"></span></div>
    <button id="logout" class="btn secondary small" type="button">Log out</button>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Sections">
      <button data-view="overview"><span class="ico" aria-hidden="true">◎</span>Overview</button>
      <button data-view="requests" data-moderator><span class="ico" aria-hidden="true">✉</span>Requests<span id="req-count" class="nav-count hidden"></span></button>
      <button data-view="communities"><span class="ico" aria-hidden="true">◇</span>Communities</button>
      <button data-view="events"><span class="ico" aria-hidden="true">▤</span>Events</button>
      <button data-view="publish"><span class="ico" aria-hidden="true">＋</span>Publish event</button>
      <button data-view="analytics"><span class="ico" aria-hidden="true">▥</span>Analytics</button>
      <button data-view="pushes"><span class="ico" aria-hidden="true">◉</span>Pushes</button>
      <button data-view="students" data-moderator><span class="ico" aria-hidden="true">☰</span>Students</button>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="drawer" aria-labelledby="drawer-title">
  <div class="dlg-head">
    <div class="grow"><h3 id="drawer-title"></h3><div id="drawer-sub" class="muted small"></div></div>
    <button id="drawer-close" class="btn secondary small" type="button">Close</button>
  </div>
  <div id="drawer-body" class="dlg-body"></div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
"use strict";
const API = "/api/v1";
const PATHS = {
  me: "/admin/me", overview: "/admin/overview", communities: "/admin/communities",
  events: "/admin/events", notifications: "/admin/notifications", pushTest: "/admin/push-test",
  students: "/admin/students", analytics: "/admin/analytics",
};
const REASONS = {
  unauthorized: "Your session has expired. Sign in again.",
  not_an_admin: "This account is not an admin: it is not a moderator and owns no community.",
  moderator_only: "Only a Student Union moderator can do this.",
  not_your_community: "This event belongs to a community you do not own.",
  not_a_confirmed_admin: "You are not the owner of this community, or it is not confirmed yet (BR-01).",
  community_not_found: "This community no longer exists.",
  community_name_taken: "Another community already has this name.",
  community_not_pending: "This request has already been reviewed.",
  cannot_review_own_request: "You asked for this community yourself: another moderator must review it.",
  start_in_the_past: "The new start time is in the past.",
  event_started: "The event has already started and cannot be cancelled.",
  student_not_found: "No student with this email.",
  event_not_found: "This event no longer exists.",
  event_cancelled: "The event is cancelled and cannot be changed.",
  limit_below_confirmed: "The new limit is below the number of confirmed students. Nobody loses a place.",
  deadline_in_the_past: "The registration deadline is in the past (FR-02).",
  deadline_after_event_start: "The registration deadline is after the event starts.",
  cannot_change_own_role: "You cannot remove your own moderator role.",
  timestamp_without_offset: "A date has no time zone.",
  validation_failed: "Some fields are not filled in correctly.",
  too_many_requests: "Too many attempts. Wait a minute.",
  invalid_credentials: "Wrong email or password.",
  payload_too_large: "The text is too long.",
  // Week 13 (schema v5)
  end_before_start: "The end must be after the start.",
  poster_too_large: "The image is larger than 2 MB. Save it smaller (for example as JPEG) and try again.",
  unsupported_poster_type: "Only JPEG, PNG or WebP images. The file is something else, whatever its name says.",
  poster_unreadable: "The image is damaged or too large in pixels (over 40 megapixels).",
  poster_not_found: "This event has no poster.",
  community_not_confirmed: "The community is not confirmed, so its events cannot get a poster.",
  invalid_ticket: "Not a ticket of this event: check the code, or the QR is not from Qatys.",
  ticket_other_event: "This ticket is for another event.",
  ticket_not_confirmed: "This student is on the waiting list or cancelled: no place at this event.",
  already_checked_in: "This ticket was already used.",
  check_in_not_open: "Check-in opens 3 hours before the start.",
  check_in_closed: "Check-in closed 2 hours after the end.",
  event_not_started: "The event has not started yet.",
  event_already_finished: "The event has already ended.",
};
const KINDS = {
  event_published: ["New event", "b-mute"], waiting_list_promoted: ["Got a place", "b-info"],
  event_cancelled: ["Cancelled", "b-err"], event_rescheduled: ["Moved", "b-warn"],
  community_approved: ["Community approved", "b-ok"],
};
const STATE = {
  open: ["Open", "b-ok"], closed: ["Registration closed", "b-warn"], live: ["Live now", "b-info"],
  finished: ["Finished", "b-mute"],
  cancelled: ["Cancelled", "b-err"], draft: ["Draft", "b-mute"],
};

let token = null;
let me = null;
let current = "overview";
const freshUi = () => ({ eventFilter: { community: "", state: "all", text: "" }, logEvent: "" });
let ui = freshUi();

// ---------- small helpers ----------

const $ = (id) => document.getElementById(id);

/** Builds an element. Every value from the server is set as text, never as HTML. */
function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key in node && typeof value !== "string") node[key] = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

const store = {
  get() { try { return sessionStorage.getItem("qatys-admin-token"); } catch (_) { return null; } },
  set(v) { try { sessionStorage.setItem("qatys-admin-token", v); } catch (_) { /* private mode */ } },
  clear() { try { sessionStorage.removeItem("qatys-admin-token"); } catch (_) { /* ignore */ } },
};

const dateFmt = new Intl.DateTimeFormat("en-GB", {
  day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
});
const fmt = (iso) => (iso ? dateFmt.format(new Date(iso)) : "—");
const toLocalInput = (iso) => {
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
};
const fromLocalInput = (value) => new Date(value).toISOString();
const zoneLabel = (() => {
  const minutes = -new Date().getTimezoneOffset();
  const sign = minutes >= 0 ? "+" : "−";
  const hh = Math.floor(Math.abs(minutes) / 60), mm = Math.abs(minutes) % 60;
  return "UTC" + sign + hh + (mm ? ":" + String(mm).padStart(2, "0") : "");
})();
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

function toast(text, ok = true) {
  const node = h("div", { class: "toast " + (ok ? "ok" : "err"), role: ok ? "status" : "alert", text });
  $("toasts").append(node);
  setTimeout(() => node.remove(), ok ? 4500 : 7000);
}

function reason(res) {
  const code = res.data && res.data.error;
  if (code === "account_locked") {
    return "Account locked after 5 wrong passwords. Try again in " +
      res.data.retry_after_minutes + " min, or ask a moderator to unlock it.";
  }
  if (code === "validation_failed" && res.data.detail && res.data.detail.length) {
    const d = res.data.detail[0];
    return REASONS.validation_failed + " (" + d.loc.slice(1).join(".") + ": " + d.msg + ")";
  }
  return REASONS[code] || ("Request failed: " + (code || "HTTP " + res.status));
}

async function call(method, path, body) {
  let res;
  try {
    res = await fetch(API + path, {
      method,
      headers: Object.assign(body !== undefined ? { "Content-Type": "application/json" } : {},
        token ? { Authorization: "Bearer " + token } : {}),
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (_) {
    return { status: 0, data: { error: "network" }, ok: false };
  }
  let data = null;
  try { data = await res.json(); } catch (_) { /* 204 or empty body */ }
  if (res.status === 401 && token) { signOut("Your session has expired. Sign in again."); }
  return { status: res.status, data, ok: res.ok };
}

/** GET that renders an error box instead of the view when it fails. */
async function load(path) {
  const res = await call("GET", path);
  if (res.status === 0) throw new Error("No connection to the server. It may be waking up — try again in 30 s.");
  if (!res.ok) throw new Error(reason(res));
  return res.data;
}

/** Runs an action on a button: disabled while it runs. */
async function busy(button, action) {
  const label = button.textContent;
  button.disabled = true;
  button.replaceChildren(h("span", { class: "spinner", "aria-hidden": "true" }), " ", label);
  try { return await action(); }
  finally { button.disabled = false; button.textContent = label; }
}

/** A destructive button: the first click arms it, the second one runs. */
function confirmButton(label, armedLabel, action) {
  let timer = null;
  const button = h("button", { class: "btn danger small", type: "button", text: label });
  button.addEventListener("click", async () => {
    if (!button.classList.contains("armed")) {
      button.classList.add("armed");
      button.textContent = armedLabel;
      timer = setTimeout(() => { button.classList.remove("armed"); button.textContent = label; }, 4000);
      return;
    }
    clearTimeout(timer);
    button.classList.remove("armed");
    button.textContent = label;
    await busy(button, action);
  });
  return button;
}

function pageHead(title, text, ...actions) {
  return h("div", { class: "page-head" },
    h("div", { class: "grow" }, h("h2", { text: title }), text ? h("p", { text }) : null),
    ...actions);
}

function badge(text, kind) { return h("span", { class: "badge " + kind, text }); }

function emptyBox(text, ...extra) { return h("div", { class: "empty" }, h("p", { text, style: "margin:0" }), ...extra); }

function csvDownload(name, rows) {
  const cell = (v) => {
    let s = v === null || v === undefined ? "" : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s; // no formulas when opened in Excel
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const text = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function showLogin(message) {
  $("app").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  const box = $("login-msg");
  box.textContent = message || "";
  box.classList.toggle("hidden", !message);
  $("email").focus();
}

function signOut(message) {
  token = null; me = null; ui = freshUi(); store.clear();
  if ($("drawer").open) $("drawer").close();
  showLogin(message);
}

async function start() {
  const res = await call("GET", PATHS.me);
  if (!res.ok) {
    const message = res.status === 0 ? "No connection to the server." : reason(res);
    token = null; store.clear();
    showLogin(res.status === 401 ? null : message);
    return;
  }
  me = res.data;
  updateRequestCount();
  $("who-name").textContent = me.full_name + " · " + me.email;
  $("who-role").textContent = me.is_moderator ? "Moderator" : "Community owner";
  for (const b of document.querySelectorAll("nav.side [data-moderator]")) {
    b.classList.toggle("hidden", !me.is_moderator);
  }
  $("login-view").classList.add("hidden");
  $("app").classList.remove("hidden");
  const fromHash = location.hash.slice(1);
  const moderatorOnly = ["students", "requests"];
  go(VIEWS[fromHash] && (!moderatorOnly.includes(fromHash) || me.is_moderator) ? fromHash : "overview");
}

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.submitter || e.target.querySelector("button");
  await busy(button, async () => {
    const res = await call("POST", "/auth/login",
      { email: $("email").value.trim(), password: $("password").value });
    if (!res.ok) {
      showLogin(res.status === 0 ? "No connection to the server. It may be waking up — try again in 30 s." : reason(res));
      return;
    }
    token = res.data.token;
    store.set(token);
    $("password").value = "";
    await start();
  });
});
$("logout").addEventListener("click", () => signOut());

window.addEventListener("hashchange", () => {
  const view = location.hash.slice(1);
  if (me && VIEWS[view] && view !== current) go(view);

async function go(view, options) {
  current = view;
  if (location.hash.slice(1) !== view) history.replaceState(null, "", "#" + view);
  for (const b of document.querySelectorAll("nav.side button")) {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  const main = $("view");
  main.replaceChildren(h("p", { class: "muted" }, h("span", { class: "spinner" }), " Loading…"));
  try {
    const content = await VIEWS[view](options || {});
    if (current === view) main.replaceChildren(...[content].flat().filter(Boolean));
  } catch (err) {
    if (current === view && token) {
      main.replaceChildren(h("div", { class: "notice err", role: "alert", text: err.message }),
        h("button", { class: "btn secondary", type: "button", text: "Try again", onclick: () => go(view, options) }));
    }
  }
}

function eventCard(e) {
  const full = e.confirmed_count >= e.participant_limit;
  const percent = Math.min(100, Math.round((e.confirmed_count / e.participant_limit) * 100));
  const [stateLabel, stateClass] = STATE[e.state] || [e.state, "b-mute"];
  const live = e.status === "published";
  const started = e.state === "live" || e.state === "finished";
  const doorOpen = live && Date.now() >= new Date(e.starts_at).getTime() - 3 * 3600000
    && Date.now() <= new Date(e.ends_at).getTime() + 2 * 3600000;
  return h("article", { class: "card event" + (e.poster_url ? " has-poster" : "") },
    e.poster_url ? h("img", { class: "thumb", src: e.poster_url, alt: "Poster of " + e.title, loading: "lazy" }) : null,
    h("div", {},
      h("div", { class: "title", text: e.title }),
      h("div", { class: "meta" },
        h("span", { text: e.community_name }),
        h("span", { text: "Deadline " + fmt(e.registration_deadline) }),
        h("span", { text: "Starts " + fmt(e.starts_at) }),
        h("span", { text: "Ends " + fmt(e.ends_at) }),
        e.location ? h("span", { text: e.location }) : null),
      e.previous_starts_at ? h("div", { class: "muted small", style: "margin-top:4px", text: "Moved from " + fmt(e.previous_starts_at) }) : null,
      started && live ? h("div", { class: "small", style: "margin-top:6px" },
        badge("Attended " + e.attended_count + " / " + e.confirmed_count, "b-ok"), " ",
        e.feedback_count ? h("span", {}, h("span", { class: "stars", text: starText(e.average_rating) }),
          " " + Number(e.average_rating).toFixed(1) + " · " + plural(e.feedback_count, "rating", "ratings")) : h("span", { class: "muted", text: "no ratings yet" })) : null),
    h("div", { class: "side" },
      badge(stateLabel, stateClass),
      h("div", { class: "small", text: e.confirmed_count + " / " + e.participant_limit + " places" +
        (e.waiting_count ? " · " + e.waiting_count + " waiting" : "") }),
      h("div", { class: "meter" + (full ? " full" : ""), role: "img", "aria-label": percent + "% of places taken" },
        h("span", { style: "width:" + percent + "%" })),
      h("div", { class: "muted small", text: "Pushes " + e.sent_count + " / " + e.notified_count + " delivered" })),
    h("div", { class: "row-actions" },
      doorOpen ? h("button", { class: "btn small", type: "button", text: "Check-in", onclick: () => openCheckIn(e) }) : null,
      h("button", { class: "btn secondary small", type: "button", text: "Participants", onclick: () => openParticipants(e) }),
      live || e.poster_url ? h("button", { class: "btn secondary small", type: "button", text: e.poster_url ? "Poster" : "Add poster", onclick: () => openPoster(e) }) : null,
      live && !started ? h("button", { class: "btn secondary small", type: "button", text: "Edit", onclick: () => openEventForm(e) }) : null,
      started && live ? h("button", { class: "btn secondary small", type: "button", text: "Feedback", onclick: () => openFeedback(e) }) : null,
      e.state === "live" ? confirmButton("Finish now", "Click again: feedback opens", async () => {
        const res = await call("POST", "/admin/events/" + e.event_id + "/finish");
        if (!res.ok) { toast(reason(res), false); return; }
        toast("“" + e.title + "” has ended. Checked-in students can rate it in the app now.");
        refresh();
      }) : null,
      live && !started ? h("button", { class: "btn secondary small", type: "button", text: "Resend pushes",
        onclick: (ev) => busy(ev.currentTarget, async () => {
          const res = await call("POST", "/admin/events/" + e.event_id + "/notify");
          if (!res.ok) { toast(reason(res), false); return; }
          toast(res.data.queued
            ? "Sending " + plural(res.data.queued, "push", "pushes") + (res.data.new_recipients ? " (" + res.data.new_recipients + " to new followers)" : "") + "."
            : "Every follower has already received this event.");
          setTimeout(refresh, 1500);
        }) }) : null,
      h("button", { class: "btn secondary small", type: "button", text: "Delivery log",
        onclick: () => { ui.logEvent = String(e.event_id); go("pushes"); } }),
      live && !started ? confirmButton("Cancel event",
        "Click again: " + plural(e.confirmed_count + e.waiting_count, "student gets", "students get") + " a push", async () => {
        const res = await call("POST", "/admin/events/" + e.event_id + "/cancel");
        if (!res.ok) { toast(reason(res), false); return; }
        toast("“" + e.title + "” is cancelled. " + (res.data.notified
          ? plural(res.data.notified, "registered student gets", "registered students get") + " a push."
          : "Nobody was registered."));
        setTimeout(refresh, 1200);
      }) : null));
}

const starText = (avg) => {
  const n = Math.round(Number(avg) || 0);
  return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
};

function deliveryBadge(n) {
  if (n.sent_at) return h("span", {}, badge("Delivered", "b-ok"), h("div", { class: "muted small", text: fmt(n.sent_at) }));
  if (!n.devices) return badge("No phone signed in", "b-warn");
  return badge("Not delivered yet", "b-err");
}

function pushTestNotice(r) {
  if (!r.fcm_configured) {
    return h("div", { class: "notice err", style: "margin-top:14px",
      text: "Firebase is not configured on the server (FCM_SERVICE_ACCOUNT_JSON is empty), so no push can be sent. See docs/deployment.md, section 2." });
  }
  if (!r.devices) {
    return h("div", { class: "notice warn", style: "margin-top:14px",
      text: "No phone is signed in to " + me.email + ". Open Qatys on the phone, sign in with this account and allow notifications, then try again." });
  }
  const parts = ["Firebase accepted the push for " + plural(r.sent, "phone", "phones") + " of " + r.devices + "."];
  if (r.removed) parts.push(plural(r.removed, "old token was", "old tokens were") + " removed (app deleted or signed out).");
  if (r.failed) parts.push(r.failed + " failed: see the server log (wrong APNs key or bundle id?).");
  if (r.sent) parts.push("If nothing shows on the phone: Settings → Notifications → Qatys, and check the APNs key in Firebase (docs/testflight.md, section 0).");
  return h("div", { class: "notice " + (r.sent ? "ok" : "err"), style: "margin-top:14px", text: parts.join(" ") });
}

async function setRole(s, value, redraw) {
  const res = await call("PUT", "/admin/students/" + s.student_id + "/moderator", { is_moderator: value });
  if (!res.ok) { toast(reason(res), false); return; }
  toast(s.full_name + (value ? " is now a moderator." : " is no longer a moderator."));
  await redraw();
}

async function saveCommunity(c, changes, message) {
  const res = await call("PATCH", "/admin/communities/" + c.community_id, changes);
  if (!res.ok) { toast(reason(res), false); return false; }
  toast(message);
  const fresh = await call("GET", PATHS.me);
  if (fresh.ok) me = fresh.data;
  refresh();
  return true;
}

  $("drawer-title").textContent = title;

function openCommunityForm(c) {
  const isNew = c === null;
  const form = h("form", {},
    h("label", { for: "c-name", text: "Name" }),
    h("input", { id: "c-name", required: true, maxlength: "120", value: isNew ? "" : c.name, placeholder: "Robotics Club" }),
    h("label", { for: "c-description", text: "Description" }),
    h("textarea", { id: "c-description", maxlength: "2000", placeholder: "What the community does" }),
    h("label", { for: "c-owner", text: "Owner's email" }),
    h("input", { id: "c-owner", type: "email", required: true, value: isNew ? "" : c.owner.email, placeholder: "name@kbtu.kz" }),
    h("p", { class: "hint", text: "The owner is the one account that publishes this community's events (BR-01). They need a Qatys account." }),
    h("label", { class: "check" }, h("input", { id: "c-confirmed", type: "checkbox", checked: isNew ? true : c.is_confirmed }),
      "Confirmed by the Student Union (may publish)"),
    h("div", { class: "actions" },
      h("button", { class: "btn", type: "submit", text: isNew ? "Create community" : "Save changes" }),
      h("button", { class: "btn secondary", type: "button", text: "Cancel", onclick: () => $("drawer").close() })));
  form.querySelector("#c-description").value = isNew ? "" : (c.description || "");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    await busy(e.submitter || form.querySelector("button[type=submit]"), async () => {
      const body = {
        name: $("c-name").value.trim(),
        description: $("c-description").value.trim() || null,
        owner_email: $("c-owner").value.trim(),
        is_confirmed: $("c-confirmed").checked,
      };
      if (isNew) {
        const res = await call("POST", PATHS.communities, body);
        if (!res.ok) { toast(reason(res), false); return; }
        toast("“" + res.data.name + "” is created. Owner: " + res.data.owner.full_name + ".");
        const fresh = await call("GET", PATHS.me);
        if (fresh.ok) me = fresh.data;
        $("drawer").close(); refresh();
        return;
      }
      const changes = {};
      if (body.name !== c.name) changes.name = body.name;
      if (body.description !== (c.description || null)) changes.description = body.description;
      if (body.owner_email.toLowerCase() !== c.owner.email) changes.owner_email = body.owner_email;
      if (body.is_confirmed !== c.is_confirmed) changes.is_confirmed = body.is_confirmed;
      if (!Object.keys(changes).length) { $("drawer").close(); return; }
      if (await saveCommunity(c, changes, "“" + body.name + "” is saved.")) $("drawer").close();
    });
  });
  openDrawer(isNew ? "New community" : "Edit " + c.name, isNew ? "Moderator only" : "Created " + fmt(c.created_at), form);
  $("c-name").focus();
}

    h("button", { class: "btn secondary small", type: "button", text: "Download CSV", disabled: !data.items.length,
      onclick: () => csvDownload("qatys-event-" + ev.event_id + ".csv", [
        ["status", "waiting_position", "full_name", "email", "registered_at", "status_since", "checked_in_at"],
        ...data.items.map((r) => [r.status, r.position, r.full_name, r.email, r.created_at, r.updated_at, r.checked_in_at])]) }),
    h("button", { class: "btn secondary small", type: "button", text: "Copy emails", disabled: !active.length,
      onclick: async () => {
        try { await navigator.clipboard.writeText(active.map((r) => r.email).join(", ")); toast("Copied " + plural(active.length, "email", "emails") + "."); }
        catch (_) { toast("The browser did not allow copying.", false); }
      } }));
  const table = data.items.length ? h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Status", "Student", "Since", "At the door"].map((t) => h("th", { scope: "col", text: t })))),
    h("tbody", {}, data.items.map((r) => h("tr", {},
      h("td", {}, badge(label[r.status][0] + (r.position ? " #" + r.position : ""), label[r.status][1])),
      h("td", {}, h("div", { text: r.full_name }), h("div", { class: "muted small", text: r.email })),
      h("td", { class: "small", text: fmt(r.updated_at) }),
      h("td", {}, r.checked_in_at ? badge("✓ " + fmt(r.checked_in_at), "b-ok") : h("span", { class: "muted small", text: "—" })))))))
    : emptyBox("Nobody has registered yet.");
  $("drawer-body").replaceChildren(summary, actions, table);
}

// ---------- Week 13: poster, check-in, feedback ----------

const POSTER_TYPES = ["image/jpeg", "image/png", "image/webp"];
const POSTER_MAX = 2 * 1024 * 1024;

/** PUT of a raw file (the poster): the body is the image itself, not JSON. */
async function upload(path, file) {
  let res;
  try {
    res = await fetch(API + path, { method: "PUT", body: file,
      headers: { "Content-Type": file.type || "application/octet-stream", Authorization: "Bearer " + token } });
  } catch (_) {
    return { status: 0, data: { error: "network" }, ok: false };
  }
  let data = null;
  try { data = await res.json(); } catch (_) { /* empty */ }
  if (res.status === 401 && token) signOut("Your session has expired. Sign in again.");
  return { status: res.status, data, ok: res.ok };
}

function openPoster(e) {
  let chosen = null;
  const preview = h("div", {}, e.poster_url
    ? h("img", { class: "poster-preview", src: e.poster_url, alt: "Current poster of " + e.title })
    : h("div", { class: "poster-empty", text: "No poster yet — the app shows the community's colours." }));
  const message = h("div", { "aria-live": "polite" });
  const input = h("input", { id: "poster-file", type: "file", accept: POSTER_TYPES.join(",") });
  const send = h("button", { class: "btn", type: "button", text: e.poster_url ? "Replace poster" : "Upload poster", disabled: true });
  input.addEventListener("change", () => {
    message.replaceChildren();
    chosen = input.files && input.files[0];
    send.disabled = !chosen;
    if (!chosen) return;
    // Quick checks in the browser; the server checks again (it trusts no file name).
    if (chosen.size > POSTER_MAX) {
      message.replaceChildren(h("div", { class: "notice err", text: REASONS.poster_too_large + " (" + (chosen.size / 1048576).toFixed(1) + " MB)" }));
      send.disabled = true; return;
    }
    if (chosen.type && !POSTER_TYPES.includes(chosen.type)) {
      message.replaceChildren(h("div", { class: "notice err", text: REASONS.unsupported_poster_type }));
      send.disabled = true; return;
    }
    const url = URL.createObjectURL(chosen);
    preview.replaceChildren(h("img", { class: "poster-preview", src: url, alt: "New poster (not uploaded yet)",
      onload: () => URL.revokeObjectURL(url) }));
    message.replaceChildren(h("div", { class: "notice info", text: "Preview. Press “" + send.textContent + "” to publish it." }));
  });
  send.addEventListener("click", () => busy(send, async () => {
    const res = await upload("/admin/events/" + e.event_id + "/poster", chosen);
    if (!res.ok) { message.replaceChildren(h("div", { class: "notice err", text: reason(res) })); return; }
    toast("Poster saved (" + res.data.width + "×" + res.data.height + ", " + Math.round(res.data.size_bytes / 1024) + " KB, photo data removed). It is in the app now.");
    $("drawer").close(); refresh();
  }));
  const remove = e.poster_url ? confirmButton("Remove poster", "Click again to remove", async () => {
    const res = await call("DELETE", "/admin/events/" + e.event_id + "/poster");
    if (!res.ok) { toast(reason(res), false); return; }
    toast("Poster removed."); $("drawer").close(); refresh();
  }) : null;
  openDrawer(e.poster_url ? "Poster" : "Add a poster", e.title,
    preview,
    h("label", { for: "poster-file", text: "Image file" }), input,
    h("p", { class: "hint", text: "JPEG, PNG or WebP, up to 2 MB. Best: landscape 16:9, at least 1200×675 px. The server turns photos upright, scales them to 1600 px and removes EXIF and GPS data." }),
    message,
    h("div", { class: "actions" }, send, remove,
      h("button", { class: "btn secondary", type: "button", text: "Close", onclick: () => $("drawer").close() })));
}

let camera = null; // { stream, timer }

function stopCamera() {
  if (!camera) return;
  clearInterval(camera.timer);
  for (const track of camera.stream.getTracks()) track.stop();
  camera = null;
}

async function openCheckIn(e) {
  let data;
  openDrawer("Check-in", e.title, h("p", { class: "muted" }, h("span", { class: "spinner" }), " Loading…"));
  try { data = await load("/admin/events/" + e.event_id + "/registrations"); }
  catch (err) { $("drawer-body").replaceChildren(h("div", { class: "notice err", text: err.message })); return; }
  let attended = data.event.attended_count, confirmed = data.event.confirmed_count;
  const count = h("div", { class: "big-count", text: attended + " / " + confirmed });
  const log = h("div", { class: "result-log", "aria-live": "polite" });
  const input = h("input", { id: "ticket", autocomplete: "off", spellcheck: "false", maxlength: "200",
    placeholder: "Code, e.g. K7Q2XM", "aria-label": "Ticket code or QR text" });
  const submit = h("button", { class: "btn", type: "submit", text: "Check in" });
  let lastScan = "", lastScanAt = 0;

  async function checkIn(ticket) {
    ticket = ticket.trim();
    if (!ticket) return;
    const res = await call("POST", "/admin/events/" + e.event_id + "/check-in", { ticket });
    let node;
    if (res.ok) {
      attended = res.data.attended_count; confirmed = res.data.confirmed_count;
      count.textContent = attended + " / " + confirmed;
      node = h("div", { class: "notice ok" }, h("strong", { text: "✓ " + res.data.full_name }), " · " + res.data.email + " · " + fmt(res.data.checked_in_at));
    } else if (res.data && res.data.error === "already_checked_in") {
      node = h("div", { class: "notice warn", text: "Already used: " + res.data.student_name + " came in at " + fmt(res.data.checked_in_at) + ". Do not let the same ticket in twice." });
    } else if (res.data && res.data.error === "check_in_not_open") {
      node = h("div", { class: "notice warn", text: REASONS.check_in_not_open + " Opens " + fmt(res.data.opens_at) + "." });
    } else {
      node = h("div", { class: "notice err", text: reason(res) });
    }
    log.prepend(node);
    while (log.children.length > 8) log.lastChild.remove();
  }

  const form = h("form", { class: "checkin-box" }, input, submit);
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    await busy(submit, () => checkIn(input.value));
    input.value = ""; input.focus();
  });

  const scanBox = h("div", {});
  const scanButton = h("button", { class: "btn secondary", type: "button", text: "Scan QR with the camera" });
  scanButton.addEventListener("click", async () => {
    if (camera) { stopCamera(); scanBox.replaceChildren(); scanButton.textContent = "Scan QR with the camera"; return; }
    if (!("BarcodeDetector" in window) || !navigator.mediaDevices) {
      scanBox.replaceChildren(h("div", { class: "notice warn", style: "margin-top:12px",
        text: "This browser cannot read QR codes from the camera (Chrome or Edge on a Mac or Android can). Type the 6-character code under the QR instead, or use a USB QR scanner: it types into the field above." }));
      return;
    }
    let detector;
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      if (!formats.includes("qr_code")) throw new Error("no qr");
      detector = new BarcodeDetector({ formats: ["qr_code"] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      const video = h("video", { autoplay: true, playsinline: true, muted: true });
      video.srcObject = stream;
      scanBox.replaceChildren(h("div", { class: "scan" }, video, h("div", { class: "frame", "aria-hidden": "true" })));
      scanButton.textContent = "Stop camera";
      camera = { stream, timer: setInterval(async () => {
        if (video.readyState < 2) return;
        try {
          const codes = await detector.detect(video);
          const text = codes.length ? codes[0].rawValue : "";
          // The same QR stays in front of the camera: read it once per 4 seconds.
          if (text && (text !== lastScan || Date.now() - lastScanAt > 4000)) {
            lastScan = text; lastScanAt = Date.now();
            await checkIn(text);
          }
        } catch (_) { /* a frame that could not be read */ }
      }, 350) };
    } catch (err) {
      stopCamera();
      scanBox.replaceChildren(h("div", { class: "notice err", style: "margin-top:12px",
        text: "The camera could not start (" + (err.name || err.message) + "). Allow the camera for this site, or type the code." }));
    }
  });

  const opens = new Date(new Date(data.event.starts_at).getTime() - 3 * 3600000).toISOString();
  const closes = new Date(new Date(data.event.ends_at).getTime() + 2 * 3600000).toISOString();
  $("drawer-body").replaceChildren(
    h("div", { style: "display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px" },
      h("div", {}, h("div", { class: "muted small", text: "Checked in / confirmed" }), count),
      h("p", { class: "muted small", style: "margin:0;flex:1 1 240px",
        text: "Scan the QR on the student's phone (My events → Ticket), or type the 6-character code under it. One ticket gets in once. The door is open " + fmt(opens) + " – " + fmt(closes) + "." })),
    form,
    h("div", { class: "actions", style: "margin-top:10px" }, scanButton),
    scanBox,
    log);
  input.focus();
}

async function openFeedback(e) {
  openDrawer("Feedback", e.title, h("p", { class: "muted" }, h("span", { class: "spinner" }), " Loading…"));
  let data;
  try { data = await load("/admin/events/" + e.event_id + "/feedback"); }
  catch (err) { $("drawer-body").replaceChildren(h("div", { class: "notice err", text: err.message })); return; }
  const max = Math.max(1, ...data.distribution);
  const bars = h("div", { class: "bars" }, [5, 4, 3, 2, 1].map((star) => h("div", { class: "bar-row" },
    h("span", { class: "small", text: star + " ★" }),
    h("div", { class: "bar", role: "img", "aria-label": data.distribution[star - 1] + " ratings of " + star },
      h("span", { style: "width:" + Math.round(100 * data.distribution[star - 1] / max) + "%" })),
    h("span", { class: "small num", text: String(data.distribution[star - 1]) }))));
  const ev = data.event;
  $("drawer-body").replaceChildren(
    h("div", { class: "tiles", style: "margin-bottom:14px" },
      h("div", { class: "tile" }, h("div", { class: "label", text: "Average" }),
        h("div", { class: "value", text: data.average_rating === null ? "—" : Number(data.average_rating).toFixed(1) }),
        h("div", { class: "sub stars", text: data.average_rating === null ? "" : starText(data.average_rating) })),
      h("div", { class: "tile" }, h("div", { class: "label", text: "Ratings" }), h("div", { class: "value", text: data.count }),
        h("div", { class: "sub", text: "of " + ev.attended_count + " who came" }))),
    bars,
    h("div", { class: "section-title" }, h("h3", { text: "Comments" })),
    data.items.filter((f) => f.comment).length
      ? h("div", { class: "stack" }, data.items.filter((f) => f.comment).map((f) => h("div", { class: "comment" },
          h("div", { class: "small" }, h("span", { class: "stars", text: starText(f.rating) }), h("span", { class: "muted", text: " · " + fmt(f.created_at) })),
          h("div", { text: f.comment }))))
      : emptyBox(data.count ? "Ratings without comments." : "No ratings yet. Students who were checked in can rate the event in the app after it ends."),
    h("p", { class: "hint", text: "Anonymous: you see what was said, not who said it." }));
}

token = store.get();
if (token) start(); else showLogin();
