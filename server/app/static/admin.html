<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qatys Admin</title>
<style>
  :root { --bg: #ffffff; --fg: #111827; --muted: #374151; --line: #9ca3af;
          --accent: #0b3d91; --ok: #065f46; --okbg: #d1fae5; --err: #991b1b; --errbg: #fee2e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #cbd5e1; --line: #64748b;
            --accent: #93c5fd; --ok: #a7f3d0; --okbg: #064e3b; --err: #fecaca; --errbg: #7f1d1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 0 0 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; font-weight: 500; margin: 12px 0 4px; }
  input, textarea { width: 100%; min-height: 48px; padding: 10px 12px; font: inherit;
                    color: var(--fg); background: var(--bg);
                    border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  button { min-height: 48px; padding: 0 20px; margin-top: 16px; font: inherit; font-weight: 600;
           color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0f172a; } }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; }
  .ok { color: var(--ok); background: var(--okbg); }
  .err { color: var(--err); background: var(--errbg); }
  .hidden { display: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Qatys Admin</h1>
  <p class="lead">Publish an event for a community confirmed by the Student Union.
     Every subscriber gets a push. The same calls are in <a href="/docs">Swagger UI</a>.</p>

  <form id="login">
    <fieldset>
      <legend>1. Sign in</legend>
      <label for="email">University email</label>
      <input id="email" type="email" autocomplete="username" required placeholder="name@kbtu.kz">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div id="login-msg" class="msg hidden" role="status"></div>
    </fieldset>
  </form>

  <form id="publish" class="hidden">
    <fieldset>
      <legend>2. Publish an event</legend>
      <label for="community">Community ID</label>
      <input id="community" type="number" min="1" required value="2">
      <label for="title">Title</label>
      <input id="title" required maxlength="160" value="Career Day">
      <label for="description">Description</label>
      <textarea id="description" maxlength="5000">Meet 12 companies, bring your CV.</textarea>
      <label for="location">Location</label>
      <input id="location" maxlength="160" value="Main hall">
      <div class="row">
        <div><label for="deadline">Registration deadline</label>
             <input id="deadline" type="datetime-local" required></div>
        <div><label for="starts">Starts at</label>
             <input id="starts" type="datetime-local" required></div>
      </div>
      <label for="limit">Participant limit</label>
      <input id="limit" type="number" min="1" max="10000" required value="2">
      <button type="submit">Publish</button>
      <div id="publish-msg" class="msg hidden" role="status"></div>
    </fieldset>
  </form>
</main>
<script>
  const api = "/api/v1";
  let token = null;

  const $ = (id) => document.getElementById(id);
  const local = (date) => new Date(date.getTime() - date.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 16);
  const inHours = (h) => new Date(Date.now() + h * 3600000);
  $("deadline").value = local(inHours(24));
  $("starts").value = local(inHours(48));

  function show(id, text, ok) {
    const el = $(id);
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  async function call(path, body) {
    const res = await fetch(api + path, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" },
        token ? { Authorization: "Bearer " + token } : {}),
      body: JSON.stringify(body),
    });
    let data = null;
    try { data = await res.json(); } catch (_) { /* empty body */ }
    return { status: res.status, data };
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.submitter; button.disabled = true;
    try {
      const { status, data } = await call("/auth/login",
        { email: $("email").value, password: $("password").value });
      if (status === 200) {
        token = data.token;
        show("login-msg", "Signed in as " + data.student.full_name + ".", true);
        $("publish").classList.remove("hidden");
      } else if (status === 423) {
        show("login-msg", "Account locked. Try again in " + data.retry_after_minutes + " min.");
      } else {
        show("login-msg", "Sign-in failed: " + (data && data.error || status));
      }
    } catch (_) {
      show("login-msg", "No connection to the server.");
    } finally { button.disabled = false; }
  });

  $("publish").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.submitter; button.disabled = true;
    try {
      const { status, data } = await call("/communities/" + $("community").value + "/events", {
        title: $("title").value,
        description: $("description").value || null,
        location: $("location").value || null,
        // datetime-local has no zone: send the browser's offset explicitly.
        registration_deadline: new Date($("deadline").value).toISOString(),
        starts_at: new Date($("starts").value).toISOString(),
        participant_limit: Number($("limit").value),
      });
      if (status === 201) {
        show("publish-msg", "Published event #" + data.event_id + ". Pushes are on their way.", true);
      } else {
        const reasons = {
          deadline_in_the_past: "The deadline is in the past (FR-02).",
          deadline_after_event_start: "The deadline is after the event starts.",
          not_a_confirmed_admin: "You are not the confirmed admin of this community (BR-01).",
          community_not_found: "No community with this ID.",
          unauthorized: "Session expired. Sign in again.",
        };
        const code = data && data.error;
        show("publish-msg", (reasons[code] || "Not published: " + (code || status)) +
          "\nHTTP " + status);
      }
    } catch (_) {
      show("publish-msg", "No connection to the server.");
    } finally { button.disabled = false; }
  });
</script>
</body>
</html>
