# Local PostgreSQL 16 for development and tests, plus the API.
#   docker compose up -d db          # database only (tests, uvicorn --reload)
#   docker compose up --build        # database + API on http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qatys
      POSTGRES_PASSWORD: qatys
      POSTGRES_DB: qatys
    ports:
      - "5432:5432"
    volumes:
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatys"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://qatys:qatys@db:5432/qatys
      JWT_SECRET: local-development-secret-at-least-32-chars
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
